<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memproses...</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
            background:#05080f;color:#edf0f7;
            display:flex;align-items:center;justify-content:center;min-height:100vh;
        }
        body::before{
            content:'';position:fixed;inset:0;pointer-events:none;
            background:radial-gradient(ellipse 600px 400px at 30% 30%,rgba(124,58,237,0.05),transparent);
        }
        .loader{text-align:center}
        .spinner{
            width:36px;height:36px;
            border:3px solid rgba(124,58,237,0.12);
            border-top-color:#7c3aed;border-radius:50%;
            animation:spin .7s linear infinite;
            margin:0 auto .75rem;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        p{color:#94a0b8;font-size:.8rem}
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Memuat model, mohon tunggu...</p>
    </div>
    <form id="redirect-form" method="POST" action="{{ next_url }}">
        <input type="hidden" name="model_source" value="uploaded">
    </form>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('redirect-form').submit();
        });
    </script>
</body>
</html>
